name: Add-on release

# Push a tag and the installable zip appears on the Releases page:
#
#   git tag v0.5.9 && git push origin v0.5.9
#
# The tag must match the version in src/blender_addon/blender_manifest.toml -
# a mistyped tag is caught here instead of by a user with the wrong add-on.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.5.9"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the extension
        run: python tools/build_addon.py

      - name: Check the tag against the manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -E '^version\s*=' src/blender_addon/blender_manifest.toml | head -1 | cut -d'"' -f2)
          echo "tag: $TAG, manifest: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::the tag ($TAG) does not match the manifest version ($VERSION)"
            exit 1
          fi

      - name: Collect the zip
        id: zip
        run: |
          ZIP=$(ls dist/asset_assistant-*.zip | head -1)
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"
          ls -l dist/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Asset Assistant ${{ github.ref_name }}
          files: ${{ steps.zip.outputs.path }}
          body_path: RELEASE_NOTES.md

      - name: Keep the zip as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: asset-assistant-extension
          path: ${{ steps.zip.outputs.path }}
